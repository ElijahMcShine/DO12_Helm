---
apiVersion: v1
kind: Secret
metadata:
  labels:
    version: {{ .Values.version }}
    {{- with .Values.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  name: {{ .Values.projectName }}-postgres-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  {{- if .Values.postgres.dbLogin }}
  POSTGRES_USER: "{{ .Values.postgres.dbLogin }}"
  {{- else }}
  POSTGRES_USER: "cG9zdGdyZXM="
  {{- end }}
  {{- if .Values.postgres.dbPass }}
  POSTGRES_PASSWORD: "{{ .Values.postgres.dbPass }}"
  {{- else }}
  POSTGRES_PASSWORD: "TXlTdHJvbmdQYXNzd29yZA=="
  {{- end }}
