{{ if not .Values.postgres.dbHost }}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    version: {{ .Values.version }}
    {{- with .Values.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    app: {{ .Values.projectName }}-postgres-app
  name: {{ .Values.projectName }}-postgres-headless-svc
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: postgresql
    {{- if .Values.postgres.dbPort }}
    port: {{ .Values.postgres.dbPort }}
    {{- else }}
    port: 5432
    {{- end }}
    targetPort: postgresql
    protocol: TCP 
  selector:
    app: {{ .Values.projectName }}-postgres-app
{{ end }}