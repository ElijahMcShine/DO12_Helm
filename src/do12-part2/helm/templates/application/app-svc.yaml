{{ $top := . }}
{{ range .Values.microServices }}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    version: {{ $top.Values.version }}
    {{- with $top.Values.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    app: {{ $top.Values.projectName }}-{{ .name }}-service-app
  name: {{ $top.Values.projectName }}-{{ .name }}-service-svc
  namespace: {{ $top.Release.Namespace }}
spec:
  ports:
  - name: http-{{ .port }}
    port: {{ .port }}
    protocol: TCP
    targetPort: {{ .port }}
  selector:
    app: {{ $top.Values.projectName }}-{{ .name }}-service-app
  type: ClusterIP
{{ end }}