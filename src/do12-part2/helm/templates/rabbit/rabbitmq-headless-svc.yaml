{{ if not .Values.rabbitMQ.rabbitHost }}
---
apiVersion: v1
kind: Service
metadata:
  labels:
    version: {{ .Values.version }}
    {{- with .Values.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    app: {{ .Values.projectName }}-rabbit-app
  name: {{ .Values.projectName }}-rabbit-headless-svc
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: rabbimq
    {{- if .Values.rabbitMQ.rabbitPort }}
    port: {{ .Values.rabbitMQ.rabbitPort }}
    {{- else }}
    port: 5672
    {{- end }}
    targetPort: rabbimq
    protocol: TCP 
  selector:
    app: {{ .Values.projectName }}-rabbit-app
{{ end }}