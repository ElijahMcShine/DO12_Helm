---
apiVersion: v1
kind: Secret
metadata:
  labels:
    version: {{ .Values.version }}
    {{- with .Values.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  name: {{ .Values.projectName }}-rabbit-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  {{- if .Values.rabbitMQ.rabbitLogin }}
  RABBITMQ_DEFAULT_USER: "{{ .Values.rabbitMQ.rabbitLogin }}"
  {{- else }}
  RABBITMQ_DEFAULT_USER: "dXNlcg=="
  {{- end }}
  {{- if .Values.rabbitMQ.rabbitPass }}
  RABBITMQ_DEFAULT_PASS: "{{ .Values.rabbitMQ.rabbitPass }}"
  {{- else }}
  RABBITMQ_DEFAULT_PASS: "TXlTdHJvbmdQYXNzd29yZEZvclJhYmJpdA=="
  {{- end }}