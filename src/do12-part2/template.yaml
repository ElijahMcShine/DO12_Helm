apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    version: 0.0.1
    env: prod
    project: do12-part2
    app: do12-part2-postgres-app
  name: do12-part2-postgres-app
  namespace: do12-part2
spec:
  serviceName: do12-part2-postgres-headless-svc
  replicas: 1
  selector:
    matchLabels:
      app: do12-part2-postgres-app
  template:
    metadata:
      labels:
        app: do12-part2-postgres-app
    spec:
      containers:
      - name: do12-part2-postgres-app
        image: docker.mcshine.ru/library/do12-db:0.1
        imagePullPolicy: Always
        env:
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: do12-part2-postgres-secrets
                key: POSTGRES_PASSWORD
          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: do12-part2-postgres-secrets
                key: POSTGRES_USER
          - name: PGDATA
            value: /data/pgdata
        ports:
          - containerPort: 5432
            name: postgres
        volumeMounts:
          - name: postgres-data
            mountPath: /data
        resources:
            requests:
              memory: "1Gi"
              cpu: "1"
            limits:
              memory: "2Gi"
              cpu: "2"
      imagePullSecrets:
        - name: regcred
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "do12-part2-postgres-storage-class"
      resources:
        requests:
          storage: 1Gi
