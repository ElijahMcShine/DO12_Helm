# Source: s21-DO-microservices/templates/application/app-deploy.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    version: 0.0.1
    env: prod
    project: do12-part2
    app: do12-part2-booking-service-app
  name: do12-part2-booking-service-app
  namespace: do12-part2
spec:
  minReadySeconds: 5
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: do12-part2-booking-service-app
  template:
    metadata:
      labels:
        app: do12-part2-booking-service-app
    spec:
      containers:
      - image: docker.mcshine.ru/library/do12-booking:0.1
        imagePullPolicy: Always
        name: do12-part2-booking-service
        command:
          - '/bin/bash'
          - '/work/docker-entrypoint.sh'
          - 'do12-part2-postgres-headless-svc.do12-part2.svc:5432'
          - 'booking-service'
        ports:
          - containerPort: 8083
            protocol: TCP
        volumeMounts:
          - mountPath: "/etc/secrets"
            name: service-secret
            readOnly: true
          - mountPath: "/etc/conf"
            name: service-config
            readOnly: true
        securityContext:
          runAsNonRoot: true
          runAsUser: 2000
          capabilities:
            drop:
            - ALL
          privileged: false
          runAsGroup: 2000
        env:
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: do12-part2-postgres-secrets
                key: POSTGRES_PASSWORD
          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: do12-part2-postgres-secrets
                key: POSTGRES_USER
          - name: RABBIT_MQ_PASSWORD
            valueFrom:
              secretKeyRef:
                name: do12-part2-rabbit-secrets
                key: RABBITMQ_DEFAULT_PASS
          - name: RABBIT_MQ_USER
            valueFrom:
              secretKeyRef:
                name: do12-part2-rabbit-secrets
                key: RABBITMQ_DEFAULT_USER
      dnsPolicy: ClusterFirst
      imagePullSecrets:
        - name: regcred
      restartPolicy: Always
      securityContext:
        fsGroup: 2000
        fsGroupChangePolicy: Always
      volumes:
        - name: service-config
          configMap:
            name: do12-part2-booking-service-config
            items:
            - key: "srv_envs"
              path: "srv_envs"
        - name: service-secret
          secret:
            secretName: do12-part2-app-secret
            items:
            - key: ".srv_secrets"
              path: ".srv_secrets"
